services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - taskflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: taskflow-backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend:/app
      - ./storage/screenshots:/data/screenshots
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /taskflow
        NEXT_PUBLIC_API_URL: https://imehsan.com/taskflow/api
    container_name: taskflow-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /taskflow
      NEXT_PUBLIC_API_URL: https://imehsan.com/taskflow/api
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskflow_postgres:
